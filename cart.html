<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito | San Agustín</title>
  <meta name="description" content="Resumen del carrito de compra con productos seleccionados y opciones para finalizar la orden." />
  <link rel="stylesheet" href="styles/style.css" />
  <script defer src="scripts/data.js"></script>
  <script defer src="scripts/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="logo-bar">
      <a href="index.html"><img src="img/logo.svg" alt="San Agustín" class="brand-logo" /></a>
      <nav class="nav-main" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="category.html">Categorías</a>
        <a href="checkout.html">Checkout</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="section-heading">
      <h1>Tu carrito</h1>
      <p>Revisa tus productos antes de confirmar el pedido.</p>
    </section>

    <section id="cart-items" class="product-grid"></section>

    <aside class="checkout-card">
      <div class="cart-summary" id="cart-summary"></div>
      <h2>Resumen del pedido</h2>
      <p id="cart-total">Total: $0.00</p>
      <div class="product-actions">
        <button class="button-danger" onclick="clearCart()">Vaciar carrito</button>
        <a class="action-button" href="checkout.html">Continuar a checkout</a>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <p>San Agustín — Envío rápido en compras verificadas.</p>
  </footer>
</body>
</html>
